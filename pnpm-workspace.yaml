# Dependency overrides for security advisories.
# Moved here from the `pnpm.overrides` field in package.json, which pnpm 11+
# no longer reads (see https://pnpm.io/settings).
overrides:
  # GHSA-c475-qrg2-pj4r (high) — quadratic-time regex backtracking in the
  # Unix directory-listing parser of Client.list(). Published 2026-10-01 and
  # fixed only in 6.2.1, with no 5.x backport. Reached only through
  # @puppeteer/browsers > proxy-agent > pac-proxy-agent > get-uri under the
  # wdio chain; get-uri@6.0.5 still declares `basic-ftp: ^5.3.1`, so
  # Dependabot opens no PR.
  #
  # devDependency only — `pnpm audit --prod` is clean — and the code path
  # never runs: it fetches a PAC file over ftp://, and wdio never downloads a
  # browser through a proxy here (see the socks entry below).
  #
  # Crossing the major is safe: 6.0.0's only breaking change refuses separate
  # transfer hosts by default (FTP bounce hardening); the API get-uri calls
  # is unchanged. Scoped to get-uri. Drop it once get-uri requires >= 6.2.1.
  get-uri>basic-ftp: ^6.2.1
  # GHSA-3jxr-9vmj-r5cp, then GHSA-mh99-v99m-4gvg and GHSA-rgw5-rvv9-x895
  # (the latter bypasses the former's mitigation), backported to both lines
  # the wdio chain pulls in. Floors track the highest patched version of the
  # three: 1.1.18 and 2.1.4.
  # Raised to 1.1.21 / 2.1.7 for GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7
  # (high, stack exhaustion through unbounded recursion) and GHSA-q2hr-2g5m-vwhr
  # (medium, quadratic expansion), all published 2026-09-29 and backported to
  # both lines. The patterns expanded are wdio's own globs, never input.
  # Do NOT collapse these into `brace-expansion@<5.0.8: ^5.0.8`: 5.x exports
  # `{ expand }` instead of the callable default, so every minimatch <= 6 dies
  # with "expand is not a function". Only minimatch >= 9.0.6 speaks that API.
  #
  # This used to say the way out was "moving @wdio off v7 — see the follow-up
  # issue". Both halves were wrong: every @wdio/* in the tree is already on
  # v9, and no such issue was ever opened. The three minimatch lines are all
  # transitives *underneath* wdio v9, and none of them is ours to move:
  #   minimatch 3.1.5 <- glob@7 <- rimraf@3 <- puppeteer-core@13.7.0 (2022)
  #                       <- webdriverio; and <- recursive-readdir <- create-wdio
  #   minimatch 5.1.9 <- glob@8 <- mocha@10 <- @wdio/mocha-framework;
  #                       <- filelist <- jake <- ejs <- create-wdio;
  #                       <- readdir-glob <- archiver <- webdriverio
  #   minimatch 9.0.9 <- glob@10 <- @wdio/config   (this one would take 5.x)
  # So there is no upgrade to chase and nothing to track. The floors below
  # are the fix, not a stopgap. They can go the day webdriverio drops
  # puppeteer-core@13 and mocha moves off glob@8 — check with
  # `pnpm why minimatch`, and only then.
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  cookie@<0.7.0: ^0.7.0
  cross-spawn@<7.0.5: ^7.0.6
  # GHSA-ggr8-5vv4-36mx (high) — stack exhaustion when merging recursive
  # object graphs. Reached only through the wdio chain, which declares
  # `deepmerge-ts: ^7.0.3` in @wdio/config, @wdio/utils and @wdio/runner and
  # has not moved to 8.x, so Dependabot opens no PR and the floor has to come
  # from here.
  #
  # devDependency only — `pnpm audit --prod` is clean, so no copy reaches the
  # shipped Tauri binary — and the merged objects are our own wdio config and
  # capabilities, never attacker input. The floor is still worth taking: 8.0.0
  # is a real fix and nothing in the tree holds deepmerge-ts below it.
  #
  # Safe as an unscoped range: deepmerge-ts is not a direct dependency and the
  # tree carries exactly one copy, so this cannot downgrade anything of ours.
  deepmerge-ts@<8.0.0: ^8.0.0
  esbuild@<0.25.0: ^0.25.0
  # GHSA-2vr4-cq9g-pvrc and GHSA-rpw4-54j3-4h4q (fixed in 10.5.1), then
  # GHSA-h3mg-xc3c-68pw (unbounded parse diagnostic) and GHSA-j6r3-76f7-8jcv
  # (cross-family subnet check), both fixed in 10.7.1. Reached only through
  # @puppeteer/browsers > proxy-agent > socks-proxy-agent > socks under the
  # wdio chain; socks@2.8.9 still accepts the vulnerable range, so Dependabot's
  # security update fails to resolve and opens no PR.
  #
  # devDependency only — `pnpm audit --prod` is clean — and the code path
  # never runs: tests/e2e/wdio.conf.mjs declares no `services`, so wdio never
  # downloads a browser through a proxy. Scoped to `socks` so it cannot touch
  # any other copy. Drop it once socks requires ip-address >= 10.7.1.
  socks>ip-address: ^10.7.1
  # GHSA-5p4m-2wfm-xmqj widened the !!omap quadratic-CPU advisory to cover
  # 4.3.0, so the previous `<4.3.0: ^4.3.0` floor no longer clears it. 3.x is
  # still swept up to 4.x on purpose: the fix was never backported there.
  #
  # Widened a second time by GHSA-2883-xcg3-v3hh (maxTotalMergeKeys does not
  # limit CPU use for empty merge sources), which covers <4.3.2 and so swept
  # up the 4.3.1 this floor used to pin. Same shape as the previous widening:
  # the range still admitted the fix, but the lockfile sat on the now-covered
  # version. Raising the floor is what moves it. Reached through
  # @wdio/mocha-framework > mocha > js-yaml.
  js-yaml@<4.3.2: ^4.3.2
  kysely@<0.28.17: ^0.28.17
  minimatch@<3.1.3: ^3.1.3
  # GHSA-2v37-7h3g-55p8, reached only through vite > postcss at build time.
  nanoid@<3.3.17: ^3.3.17
  serialize-javascript@<7.0.5: ^7.0.5
  tar-fs@>=2.0.0 <2.1.4: ^2.1.4
  tmp@<0.2.6: ^0.2.6
  # GHSA-4cwx-7wf7-3272 (high) plus four medium cache/cookie/CRLF advisories,
  # all fixed on the same three release lines. The wdio chain carries 6.x
  # (webdriver) and 7.x (cheerio), vitest/jsdom carries 8.x — pin each.
  # 6.28.1 / 7.29.1 add GHSA-rfgv-xxqx-mfg5 and GHSA-w293-vg96-wgc3 (high,
  # WebSocket subprotocol DoS and a BalancedPool TLS-validation bypass) plus
  # seven low/medium findings, published 2026-09-29. 8.x is not affected.
  undici@<6.28.1: ^6.28.1
  undici@>=7.0.0 <7.29.1: ^7.29.1
  undici@>=8.0.0 <8.9.0: ^8.9.0
  uuid@<14.0.0: ^14.0.0
  ws@<8.21.0: ^8.21.0

# Advisories with no reachable fix. Hand-written on purpose: never pass
# `pnpm audit --ignore <CVE>`, which WRITES here and then exits 0 on every
# tree (see the long note on the audit steps in .github/workflows/ci.yml).
# A config ignore keeps the exit code honest — a tree with one ignored and
# one live finding still fails.
#
# Keyed by GHSA, not CVE: this advisory reaches us with no `cves` array at
# all, so an `ignoreCves` entry would silently never match. See the audit
# steps in .github/workflows/ci.yml for the full reasoning.
auditConfig:
  ignoreGhsas:
    # GHSA-jmr9-qjv8-65gv / CVE-2026-56876 (high, CVSS 8.1) — extract-zip
    # does not validate symlink targets, so a malicious archive can write
    # outside the extraction directory.
    #
    # Unfixable, not unpatched-by-us: extract-zip's last release is 2.0.1
    # (2020-06-10) and the package is unmaintained. The ">=2.0.2" that
    # `pnpm audit` prints under "Patched versions" is the advisory's
    # placeholder for a version that was never published — there is no
    # override that can clear this. Dependabot agrees: the alert carries
    # `first_patched_version: null` and it opened no PR.
    #
    # Exposure is nil on two independent counts:
    #   1. devDependency only. `pnpm audit --prod` is clean, so no copy of
    #      extract-zip reaches the shipped Tauri binary.
    #   2. The code path never runs. All 57 paths land on it through
    #      @puppeteer/browsers (and puppeteer-core), which uses it to unpack
    #      *downloaded browser archives*. Our E2E suite spawns tauri-driver
    #      itself against a locally built binary — tests/e2e/wdio.conf.mjs
    #      declares no `services` and no @wdio/*-service is installed, so
    #      wdio is never asked to fetch or unpack a browser.
    #
    # Drop this entry the day @wdio/utils stops pulling @puppeteer/browsers,
    # or extract-zip ships a real fix. Re-check with `pnpm why extract-zip`.
    - GHSA-jmr9-qjv8-65gv

    # GHSA-7pqw-9j4j-h8q3 (high) — "arbitrary file writes through symlink
    # archive entries". The same unvalidated-symlink flaw as the entry above,
    # re-issued under its own GHSA rather than folded into it, so it has to be
    # ignored separately or the gate stays red on a finding we already ruled
    # on.
    #
    # Every line of the reasoning above still holds, re-verified rather than
    # assumed: extract-zip's newest published version is still 2.0.1, the
    # advisory carries `first_patched_version: null` (the ">=2.0.2" under
    # "Patched versions" is again a placeholder for a release that does not
    # exist), `pnpm why extract-zip` still lands every path on puppeteer-core,
    # and tests/e2e/wdio.conf.mjs still declares no `services`, so wdio never
    # fetches or unpacks a browser. `pnpm audit --prod` remains clean.
    - GHSA-7pqw-9j4j-h8q3

    # GHSA-vfj7-8cjw-p6xm (high) — braces: stack exhaustion through deeply
    # nested brace patterns. Published 2026-09-18, surfaced by `pnpm audit`
    # on 2026-10-03.
    #
    # Unfixable for the same reason as extract-zip: braces' newest version is
    # 3.0.3 (2024-05-21), the advisory carries `first_patched_version: null`,
    # and the ">=3.0.4" under "Patched versions" is a placeholder for a
    # release that does not exist, so no override can clear it.
    #
    # Exposure is nil:
    #   1. devDependency only; `pnpm audit --prod` is clean.
    #   2. The single path is chokidar@3 <- mocha@10 <- @wdio/mocha-framework.
    #      mocha only loads chokidar for `--watch`, and wdio drives mocha
    #      programmatically without it; even then, the patterns braces would
    #      expand are our own spec globs, never input.
    #
    # Drop this entry once @wdio/mocha-framework moves to mocha >= 12 (which
    # depends on chokidar ^5, no braces), or braces ships a real fix.
    # Re-check with `pnpm why braces`.
    - GHSA-vfj7-8cjw-p6xm

# pnpm 11 turned "ignored build scripts" from a warning into a hard install
# error, so the answer has to be recorded explicitly or `pnpm install
# --frozen-lockfile` exits 1. All three were already unbuilt under pnpm 10 and
# the full suite passes that way, so `false` records the status quo rather than
# granting new postinstall execution — the safer default for a password
# manager. Do not let pnpm write this block itself: it emits placeholder
# strings and prepends them above this file's header comment.
allowBuilds:
  edgedriver: false
  esbuild: false
  geckodriver: false
