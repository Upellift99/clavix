# Flatpak manifest for Clavix.
#
# Builds from the working tree (see the `dir` source below), entirely offline:
# crates come from cargo-sources.json and npm tarballs from node-sources.json,
# both regenerated by scripts/flatpak-sources.sh. See "Flatpak" in README.md.
id: org.clavix.Clavix
runtime: org.gnome.Platform
# GNOME 51 still ships webkit2gtk-4.1 (GTK 3), which Tauri 2 links against.
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: clavix
rename-desktop-file: clavix.desktop
rename-icon: clavix

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Vaultwarden / Bitwarden API, HIBP, favicons.
  - --share=network
  # GPU for WebKit, hidraw for FIDO2 keys (2FA and Yubikey unlock), and the
  # camera for the TOTP QR scanner. There is no narrower permission for HID.
  - --device=all
  # Tray icon (StatusNotifierItem via libayatana-appindicator).
  - --talk-name=org.kde.StatusNotifierWatcher
  # Auto-lock on desktop lock: src-tauri/src/screen_lock.rs polls these.
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.freedesktop.ScreenSaver
  - --system-talk-name=org.freedesktop.login1
  # The SSH agent socket. Inside the sandbox $XDG_RUNTIME_DIR is private;
  # this mounts the host's /run/user/<uid>/clavix at the same path, so the
  # socket lands where README tells ssh to look.
  - --filesystem=xdg-run/clavix:create
  # Encrypted exports and attachments are saved as WebView downloads.
  - --filesystem=xdg-download

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: clavix
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        CARGO_HOME: /run/build/clavix/cargo
        CARGO_NET_OFFLINE: 'true'
        npm_config_store_dir: /run/build/clavix/pnpm-store
        # Opt out of the npm/pnpm update and telemetry pings, which would
        # only time out without network.
        npm_config_update_notifier: 'false'
    build-commands:
      # Serve the pre-downloaded tarballs as a registry on loopback: the
      # build sandbox has no network, but it does have `lo`.
      - |
        python3 packaging/flatpak/npm-registry.py 4873 npm-registry &
        server=$!
        for _ in $(seq 50); do
          python3 -c 'import socket; socket.create_connection(("127.0.0.1", 4873))' 2>/dev/null && break
          sleep 0.1
        done
        status=0
        node pnpm/bin/pnpm.mjs install --frozen-lockfile --registry=http://127.0.0.1:4873/ || status=$?
        kill "$server"
        exit "$status"
      - node pnpm/bin/pnpm.mjs run build
      # Distribution builds drop the GitHub update check (Flatpak delivers
      # updates) and turn on custom-protocol, which tauri-cli would add:
      # without it the binary points at the Vite dev server.
      - cargo build --release --locked --offline --manifest-path src-tauri/Cargo.toml
        --no-default-features --features tauri/custom-protocol
      - install -Dm755 src-tauri/target/release/clavix /app/bin/clavix
      - install -Dm644 packaging/linux/clavix.desktop /app/share/applications/clavix.desktop
      - install -Dm644 packaging/linux/org.clavix.Clavix.metainfo.xml /app/share/metainfo/org.clavix.Clavix.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/clavix.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/clavix.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/clavix.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/clavix.png
      - install -Dm644 assets/clavix-logo.svg /app/share/icons/hicolor/scalable/apps/clavix.svg
    sources:
      # The local checkout. A Flathub submission would swap this for a
      # `git` source pinned to a release tag and commit.
      - type: dir
        path: ../..
        skip:
          - node_modules
          - build
          - .svelte-kit
          - src-tauri/target
          - src/lib/paraglide
          - .flatpak-builder
          - flatpak-build
      # pnpm itself, pinned to `packageManager` in package.json.
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.21.0.tgz
        sha512: 521705bce689924eac72f5a3587122f362689ef6571e55ba80076fd637c11132ecffada26fad4ea79c485bfddbfd3d5a2a5b05805a77e893de71ec8a6cca3bb1
        dest: pnpm
      - cargo-sources.json
      - node-sources.json
