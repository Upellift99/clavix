name: Dependabot Flatpak sources

# Dependabot updates pnpm-lock.yaml and Cargo.lock but never the offline
# sources the Flatpak build reads (packaging/flatpak/*-sources.json), so
# every bot PR used to arrive with "Flatpak sources up to date" red and had
# to be regenerated by hand (#487-#490, batched into #495). This workflow
# regenerates them on the PR branch and pushes the result.
#
# pull_request_target, because a run triggered by Dependabot only gets a
# read-only GITHUB_TOKEN. It runs with the base branch's workflow and
# secrets, so it must never execute code from the PR: the generators come
# from the base checkout and only READ the PR's two lockfiles, as data. No
# install, no build, no script from the PR tree.
#
# The push uses FLATPAK_SOURCES_TOKEN, a fine-grained PAT limited to this
# repository with Contents: write, stored as a Dependabot secret. A push
# made with GITHUB_TOKEN would not start the CI run that has to turn green.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - pnpm-lock.yaml
      - src-tauri/Cargo.lock

permissions:
  contents: read

concurrency:
  group: dependabot-flatpak-sources-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate Flatpak sources
    # Only Dependabot's own branches in this repository: a fork's PR must
    # never get a write token.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the base branch (generators)
        uses: actions/checkout@v7
        with:
          path: base
          persist-credentials: false

      - name: Checkout the PR branch (lockfiles)
        uses: actions/checkout@v7
        with:
          path: pr
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.FLATPAK_SOURCES_TOKEN }}

      - name: Install the generators' dependencies
        run: sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Regenerate the offline sources
        # Same generators and pins as the "Flatpak sources up to date" check
        # in ci.yml, so what is pushed here is what that check expects.
        run: |
          pipx run flatpak-cargo-generator==0.1.5 pr/src-tauri/Cargo.lock -o pr/packaging/flatpak/cargo-sources.json
          python3 -I base/scripts/flatpak-node-sources.py pr/pnpm-lock.yaml > pr/packaging/flatpak/node-sources.json

      - name: Commit and push if they changed
        working-directory: pr
        run: |
          if git diff --quiet -- packaging/flatpak/; then
            echo "Flatpak sources already match the lockfiles."
            exit 0
          fi
          git diff --stat -- packaging/flatpak/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(flatpak): regenerate offline sources" -- packaging/flatpak/
          git push origin "HEAD:${HEAD_REF}"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
