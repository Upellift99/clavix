# TEMPORARY (#454): Windows upgrade test for the publisher rename.
# Remove before merging.
name: TMP Windows upgrade test

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  upgrade:
    name: TMP Windows upgrade (0.29.0 -> 0.29.1)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the 0.29.0 installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.29.0 --repo $env:GITHUB_REPOSITORY -p 'clavix_0.29.0_x64-setup.exe' -p 'clavix_0.29.0_x64_en-US.msi' -D old
          Get-ChildItem old

      - name: Build 0.29.1 without the hook
        shell: pwsh
        run: |
          $p = 'src-tauri/tauri.conf.json'
          $c = Get-Content $p -Raw | ConvertFrom-Json
          $c.version = '0.29.1'
          $c.bundle.PSObject.Properties.Remove('windows')
          $c | ConvertTo-Json -Depth 20 | Set-Content $p
          pnpm tauri build --bundles nsis
          New-Item -ItemType Directory -Force new | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/clavix_0.29.1_x64-setup.exe new/nohook-setup.exe
          git checkout -- $p

      - name: Build 0.29.1 with the hook
        shell: pwsh
        run: |
          $p = 'src-tauri/tauri.conf.json'
          $c = Get-Content $p -Raw | ConvertFrom-Json
          $c.version = '0.29.1'
          $c | ConvertTo-Json -Depth 20 | Set-Content $p
          pnpm tauri build --bundles nsis,msi
          Copy-Item src-tauri/target/release/bundle/nsis/clavix_0.29.1_x64-setup.exe new/hook-setup.exe
          Copy-Item src-tauri/target/release/bundle/msi/clavix_0.29.1_x64_en-US.msi new/hook.msi
          git checkout -- $p

      - name: Run the upgrade scenarios
        shell: pwsh
        run: .github/scripts/tmp-windows-upgrade.ps1 -Old old -New new
