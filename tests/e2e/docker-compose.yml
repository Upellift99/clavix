services:
  vaultwarden:
    image: vaultwarden/server:1.37.4-alpine
    container_name: clavix-e2e-vaultwarden
    environment:
      DOMAIN: http://127.0.0.1:8765
      SIGNUPS_ALLOWED: "true"
      INVITATIONS_ALLOWED: "true"
      SHOW_PASSWORD_HINT: "false"
      WEB_VAULT_ENABLED: "false"
      LOG_LEVEL: warn
      # Short PBKDF2 iterations keep test login time under 500ms. Production
      # defaults (600000) would make every E2E run wait seconds per unlock
      # for no added signal — the crypto surface we test is the same either way.
      PASSWORD_ITERATIONS: "100000"
    ports:
      - "8765:80"
    tmpfs:
      - /data
    healthcheck:
      # 127.0.0.1, not localhost: since 1.37.x the Alpine image resolves
      # localhost to ::1 first and Rocket listens on IPv4 only, so the
      # name-based probe is refused forever and the container never
      # turns healthy even though the port answers.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/alive"]
      interval: 2s
      timeout: 2s
      retries: 30
